name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows NSIS release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate tag matches package version
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package.json version.' }
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match package.json version '$packageVersion' (expected '$expectedTag')."
          }
          Write-Host "Validated tag $env:RELEASE_TAG for package version $packageVersion."

      - name: Install locked dependencies
        run: npm ci
        working-directory: source

      - name: Build Windows installer
        run: npm run release:win
        working-directory: source

      - name: Upload updater release assets
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package.json version.' }
          $installerName = "TWC-Stafford-Music-Scheduler-Setup-$packageVersion.exe"
          $requiredNames = @('latest.yml', $installerName, "$installerName.blockmap")
          $assets = @(Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Name -in $requiredNames })
          $missingFiles = @($requiredNames | Where-Object { $_ -notin $assets.Name })
          if ($missingFiles.Count -gt 0) {
            throw "Build output is missing required asset(s): $($missingFiles -join ', ')"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TAG `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $env:RELEASE_TAG." }
          }

          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          & gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "GitHub CLI failed to upload assets for $env:RELEASE_TAG." }
          Write-Host "Uploaded $($assets.Name -join ', ') to $env:GITHUB_REPOSITORY release $env:RELEASE_TAG."

      - name: Verify updater release assets
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $releaseUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$([uri]::EscapeDataString($env:RELEASE_TAG))"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $deadline = (Get-Date).AddMinutes(2)
          do {
            try {
              $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get
              $assets = @($release.assets | ForEach-Object { $_.name })
              $hasLatest = $assets -contains 'latest.yml'
              $installer = @($assets | Where-Object { $_ -match '^TWC-Stafford-Music-Scheduler-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$' } | Select-Object -First 1)
              $hasInstaller = $installer.Count -gt 0
              $hasBlockmap = $installer.Count -gt 0 -and $assets -contains "$($installer[0]).blockmap"
              if ($hasLatest -and $hasInstaller -and $hasBlockmap) {
                Write-Host "Verified latest.yml, $($installer[0]), and its blockmap for $env:RELEASE_TAG."
                exit 0
              }
              $missing = @()
              if (-not $hasLatest) { $missing += 'latest.yml' }
              if (-not $hasInstaller) { $missing += 'versioned Windows installer EXE' }
              if ($hasInstaller -and -not $hasBlockmap) { $missing += "$($installer[0]).blockmap" }
              Write-Host "Waiting for missing release assets: $($missing -join ', '). Uploaded assets: $($assets -join ', ')"
            } catch { Write-Host "Waiting for release assets: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          $finalAssets = @()
          try {
            $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get
            $finalAssets = @($release.assets | ForEach-Object { $_.name })
          } catch {
            throw "Could not verify release $env:RELEASE_TAG at $releaseUri after waiting for uploads: $($_.Exception.Message)"
          }
          $missing = @()
          if ($finalAssets -notcontains 'latest.yml') { $missing += 'latest.yml' }
          $finalInstaller = @($finalAssets | Where-Object { $_ -match '^TWC-Stafford-Music-Scheduler-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$' } | Select-Object -First 1)
          if ($finalInstaller.Count -eq 0) {
            $missing += 'versioned Windows installer EXE'
          } elseif ($finalAssets -notcontains "$($finalInstaller[0]).blockmap") {
            $missing += "$($finalInstaller[0]).blockmap"
          }
          throw "Release $env:RELEASE_TAG is missing required updater asset(s): $($missing -join ', '). Uploaded assets: $($finalAssets -join ', ')"
