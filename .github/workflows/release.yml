name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows NSIS release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate tag matches package version
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package.json version.' }
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match package.json version '$packageVersion' (expected '$expectedTag')."
          }
          Write-Host "Validated tag $env:RELEASE_TAG for package version $packageVersion."

      - name: Install locked dependencies
        run: npm ci
        working-directory: source

      - name: Build Windows installer
        run: npm run release:win
        working-directory: source

      - name: Upload Windows release assets
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package.json version.' }
          $installerName = "TWC-Stafford-Music-Scheduler-Setup-$packageVersion.exe"
          $requiredNames = @('latest.yml', $installerName, "$installerName.blockmap")
          $assets = @(Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Name -in $requiredNames })
          $missingFiles = @($requiredNames | Where-Object { $_ -notin $assets.Name })
          if ($missingFiles.Count -gt 0) {
            throw "Build output is missing required asset(s): $($missingFiles -join ', ')"
          }

          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG @assetPaths `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TAG `
              --notes "Windows installer for TWC Spotify Scheduler." `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $env:RELEASE_TAG." }
          } else {
            & gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub CLI failed to upload assets for $env:RELEASE_TAG." }
          }
          Write-Host "Uploaded $($assets.Name -join ', ') to $env:GITHUB_REPOSITORY release $env:RELEASE_TAG."

      - name: Verify downloaded release assets
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "TWC-Stafford-Music-Scheduler-Setup-$version.exe"
          $localFiles = @(
            "release/$installer",
            "release/$installer.blockmap",
            'release/latest.yml'
          )
          $downloadDir = Join-Path $env:RUNNER_TEMP "windows-assets-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $patterns = @($localFiles | ForEach-Object { '--pattern'; Split-Path -Leaf $_ })
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloadDir @patterns
          if ($LASTEXITCODE -ne 0) { throw "Could not download release assets for $env:RELEASE_TAG." }

          foreach ($localFile in $localFiles) {
            $name = Split-Path -Leaf $localFile
            $download = Join-Path $downloadDir $name
            $expected = (Get-FileHash -LiteralPath $localFile -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
            if ($actual -cne $expected) { throw "SHA-256 mismatch for $name." }
            Write-Host "Verified SHA-256 for $name."
          }
